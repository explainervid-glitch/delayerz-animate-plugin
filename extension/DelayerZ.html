<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelayerZ</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="shell">

        <!-- Tool rail: one icon per tool, the open one in blue. One tool at a time;
             the footer and log on the right are shared. -->
        <div class="tool-rail" role="tablist" aria-label="Tool" aria-orientation="vertical">
            <button type="button" class="tool-btn" role="tab" id="tabDelayBtn" aria-controls="tabDelay"
                aria-selected="true" title="Delay" aria-label="Delay">
                <!-- Staggered bars -->
                <svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M2 3.5h5M4.5 7h5M7 10.5h5" />
                </svg>
            </button>
            <button type="button" class="tool-btn" role="tab" id="tabMovementBtn" aria-controls="tabMovement"
                aria-selected="false" title="Movement" aria-label="Movement">
                <!-- Tabler "walk", MIT License (tabler.io/icons) -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 4a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                    <path d="M7 21l3 -4" />
                    <path d="M16 21l-2 -4l-3 -3l1 -6" />
                    <path d="M6 12l2 -3l4 -1l3 3l3 1" />
                </svg>
            </button>
        </div>

        <div class="panel">

            <!-- ===== Delay: stagger layers ===== -->
            <div class="tab-panel" id="tabDelay" role="tabpanel" aria-labelledby="tabDelayBtn">

                <!-- Delay -->
                <div class="field">
                    <label class="field-label" for="delay">Delay (frames)</label>
                    <div class="stepper">
                        <button id="delayDown" type="button" tabindex="-1" title="1 frame less">&minus;</button>
                        <input type="number" id="delay" value="5" min="1" max="999" title="Drag left or right to change. Click to type.">
                        <button id="delayUp" type="button" tabindex="-1" title="1 frame more">+</button>
                    </div>
                </div>

                <!-- Order -->
                <div class="field">
                    <span class="field-label">Start from</span>
                    <div class="segmented" role="radiogroup">
                        <label title="Bottom layer starts first, then upward">
                            <input type="radio" name="mode" value="normal" checked><span>Bottom</span>
                        </label>
                        <label title="Top layer starts first, then downward">
                            <input type="radio" name="mode" value="inverted"><span>Top</span>
                        </label>
                        <label title="Layers start in random order">
                            <input type="radio" name="mode" value="random"><span>Random</span>
                        </label>
                    </div>
                </div>

                <!-- Apply + Undo -->
                <div class="actions">
                    <button id="applyBtn">Apply</button>
                    <button id="undoBtn" disabled title="Undo the whole DelayerZ operation in one step">Undo</button>
                </div>
            </div>

            <!-- ===== Movement: change character1 to character2 at the playhead ===== -->
            <div class="tab-panel" id="tabMovement" role="tabpanel" aria-labelledby="tabMovementBtn" hidden>

                <!-- Target symbol (character2) + Pick -->
                <div class="row">
                    <div class="target-cell field-label target-label" id="targetLabel">Target: <span id="target" class="target-none">none</span></div>
                    <button id="pickBtn" type="button" class="pick-btn"
                        title="Pick the selected symbol (on stage, or in the Library)" aria-label="Pick symbol">
                        <!-- Lucide "pipette" v0.460.0, ISC License (lucide.dev) -->
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m2 22 1-1h3l9-9" />
                            <path d="M3 21v-3l9-9" />
                            <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" />
                        </svg>
                    </button>
                </div>

                <!-- Transition length -->
                <div class="stepper">
                    <label class="stepper-value" id="lengthCell" title="Transition length in frames. Drag left or right to change. Click to type.">
                        <input type="number" id="length" value="30" min="1" max="999" aria-label="Transition length in frames">
                        <span class="unit" aria-hidden="true">f</span>
                    </label>
                </div>

                <!-- Change Movement / Continue / Finish (one button, three steps) -->
                <div class="actions">
                    <button id="movementBtn" title="Create the transition: character2 starts at the playhead, the copy fills the frames before it">Change Movement</button>
                </div>
            </div>

            <!-- Footer: one button, version + log icon -->
            <div class="footer">
                <button id="logBtn" type="button" title="Show log" aria-pressed="false" aria-controls="log">
                    <span>v1.7.0</span>
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                        stroke-width="1.2" stroke-linecap="square" aria-hidden="true">
                        <path d="M1.5 2.5h9M1.5 6h9M1.5 9.5h6" />
                    </svg>
                </button>
            </div>

            <!-- Log (hidden until the log button opens it), under the footer -->
            <div id="log" class="log" hidden>
                <div class="log-empty">No messages yet.</div>
            </div>

        </div>

    </div>

    <!-- CEP library (required) -->
    <script src="js/CSInterface.js"></script>
    <!-- Panel Logic -->
    <script src="js/main.js"></script>

</body>

</html>
